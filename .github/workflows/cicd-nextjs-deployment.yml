name: Next.js CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger local deploy webhook
      run: |
        curl --fail-with-body --show-error --silent \
          --request POST \
          --header "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
          --header "Content-Type: application/json" \
          --data '{"ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}' \
          "${{ secrets.DEPLOY_WEBHOOK_URL }}"
