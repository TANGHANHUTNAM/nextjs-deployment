name: Next.js CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH to Server and Build Locally
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }} 
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd ~/project/nextjs-deployment       
          git pull origin main           
          docker build . --file Dockerfile --tag nextjs-app:latest        
          docker compose up -d --remove-orphans
          # docker rm -f nextjs_prod || true
          # docker run -d -p 3000:3000 --name nextjs_prod nextjs-app:latest